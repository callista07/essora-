<div class="nature-review-form">
  <form id="reviewForm" onsubmit="submitForm(event)">
    <h2>🌿 Share Your Thoughts</h2>

    <label for="name">Your Name</label>
    <input type="text" id="name" name="name" required placeholder="Your name" />

    <label for="email">Your Email</label>
    <input type="email" id="email" name="email" required placeholder="example@mail.com" />

    <label for="rating">Rating</label>
    <select id="rating" name="rating" required>
      <option value="" disabled selected>Select rating</option>
      <option value="5">🌟🌟🌟🌟🌟 (Excellent)</option>
      <option value="4">🌟🌟🌟🌟</option>
      <option value="3">🌟🌟🌟</option>
      <option value="2">🌟🌟</option>
      <option value="1">🌟</option>
    </select>

    <label for="review">Your Review</label>
    <textarea id="review" name="review" rows="5" required placeholder="Tell us what you loved..."></textarea>

    <button type="submit">Send Review</button>
  </form>

  <div id="thankYouMessage" style="display: none;">
    <h3>🌸 Thank You!</h3>
    <p>Your thoughts are like sunlight to our forest — they help us grow. 🌲</p>
  </div>
</div>

<style>
  .nature-review-form {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(to bottom, #e8f5e9, #f1f8e9);
    padding: 30px;
    border-radius: 12px;
    max-width: 500px;
    margin: auto;
    box-shadow: 0 8px 16px rgba(34, 139, 34, 0.2);
  }

  .nature-review-form h2 {
    text-align: center;
    color: #2e7d32;
    margin-bottom: 20px;
  }

  label {
    display: block;
    margin: 15px 0 5px;
    color: #33691e;
  }

  input, select, textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #a5d6a7;
    border-radius: 8px;
    box-sizing: border-box;
    background-color: #f9fbe7;
    font-size: 14px;
  }

  button {
    margin-top: 20px;
    background-color: #66bb6a;
    color: white;
    padding: 12px;
    width: 100%;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.3s ease;
  }

  button:hover {
    background-color: #43a047;
  }

  #thankYouMessage {
    text-align: center;
    color: #2e7d32;
    margin-top: 20px;
  }

  #thankYouMessage p {
    font-size: 16px;
    background: #f1f8e9;
    padding: 15px;
    border-radius: 10px;
  }
</style>

<script>
  function submitForm(event) {
    event.preventDefault();
    document.getElementById("reviewForm").style.display = "none";
    document.getElementById("thankYouMessage").style.display = "block";

    // Optional: Connect to a backend or storage solution here
  }
</script>
